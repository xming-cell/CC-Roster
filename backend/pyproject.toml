[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # ADR-006: 跨平台 OS 凭据库, 避免明文落盘, 无需自研系统 API; 不可用时回退 0600 文件
    "keyring>=25.7.0",
    # round-trip TOML, 保留注释 / 键序 / 未知字段, 避免 N-4 破坏用户配置
    "tomlkit>=0.13",
]

[dependency-groups]
# 015: 桌面薄壳的 WebView 窗口; 可选安装, 不影响后端 / 前端验收
desktop = [
    "pywebview>=5.3",
    "pystray>=0.19",
    "pillow>=10.4",
    "keyboard>=0.13.5",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
